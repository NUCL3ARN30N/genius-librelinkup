[package]
name = "gllu-core"
version = "1.1.0"
edition = "2024"
description = "Shared code of Genius LibreLinkUp: LibreLinkUp client, encrypted glucose store, sync protocol"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
hex = "0.4.3"
pdf-writer = "0.15.0"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subsetter = "0.2.6"
thiserror = "2.0.21"
tracing = "0.1.44"
ttf-parser = "0.25.1"
webpki-roots = "1.0.11"
zip = { version = "9.2.2", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }
