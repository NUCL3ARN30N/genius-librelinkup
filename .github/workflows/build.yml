name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# read-only by default; the docker and release jobs ask for what they need
permissions:
  contents: read

# Release assets (the in-app updater and server/packaging/install-lxc.sh rely on these names):
#   genius-librelinkup-<v>-setup.exe        Windows installer
#   genius-librelinkup-<v>-windows-x64.exe  Windows portable exe
#   genius-librelinkup_<v>-1_amd64.deb      Linux package
#   gllu-server-<v>-linux-x64               caching server binary (glibc ≥ 2.35)
#   SHA256SUMS.txt                          checksums of all of the above (required by the updater)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude gllu-server
      - run: cargo build --release -p genius-librelinkup
      - name: Installer and portable exe
        shell: pwsh
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'genius-librelinkup').version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /DAppVersion=$version packaging\windows\installer.iss
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\installer\*.exe out\
          Copy-Item target\release\genius-librelinkup.exe "out\genius-librelinkup-$version-windows-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  linux:
    # 22.04 keeps the glibc requirement low (Debian 12, Ubuntu 22.04 and newer)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Slint
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace
      - run: cargo build --release -p genius-librelinkup -p gllu-server
      - run: cargo install cargo-deb --locked
      - run: cargo deb -p genius-librelinkup --no-build
      - name: Collect
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="gllu-server") | .version')
          mkdir -p out
          cp target/debian/*.deb out/
          cp target/release/gllu-server "out/gllu-server-$version-linux-x64"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*

  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gllu-server" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
