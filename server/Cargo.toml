[package]
name = "bllu-server"
version = "0.1.1"
edition = "2024"
description = "Always-on caching server for Better LibreLinkUp: polls LibreLinkUp and serves the history to paired desktop apps"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
bllu-core = { path = "../core" }
chrono = "0.4.45"
hex = "0.4.3"
ipnet = "2.12.2"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.1", features = ["timeout", "add-extension"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
